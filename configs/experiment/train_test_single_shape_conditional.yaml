# @package _global_

defaults:
  - override /model: denoiser_conditional
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml

data:
  datamodule:
    num_workers: 8
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 100
        total_lag_time: 5
        lag_subsample_rate: 100

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 100
        total_lag_time: 5
        lag_subsample_rate: 100


      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 100
        total_lag_time: 5
        lag_subsample_rate: 100

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 2
    N_structures: ${data.datamodule.datasets.train.total_lag_time}
  max_radius: 1000.0
  optim:
    lr: 0.002
  conditioner:
    _target_: jamun.model.conditioners.PositionConditioner
    N_structures: ${model.arch.N_structures}

trainer:
  val_check_interval: 0.5
  max_epochs: 1


logger:
  wandb:
    group: ALA_ALA, capped diamines, conditional denoiser
    notes: "Running on ALA_ALA capped diamine, self-conditioned denoiser" 
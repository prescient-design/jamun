# @package _global_
# Training SpatioTemporalConditioner on 2AA capped diamines data

defaults:
  - override /model: denoiser_conditional_spatiotemporal
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: False
        subsample: 80
        total_lag_time: 8
        lag_subsample_rate: 10
        start_frame: 0 
        num_frames: 800000

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: False
        subsample: 80
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: ${data.datamodule.datasets.train.lag_subsample_rate}
        start_frame: 800000 
        num_frames: 100000

      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: False
        subsample: 80
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: ${data.datamodule.datasets.train.lag_subsample_rate}
        start_frame: 900000 
        num_frames: 200000

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 1
  max_radius: 1.0
  optim:
    lr: 0.002  # Slightly reduced learning rate for stability

trainer:
  val_check_interval: 0.5
  max_epochs: 100

logger:
  wandb:
    group: model_comparison_delta_t_T_models_graphs
    notes: "SpatioTemporalConditioner on 2AA capped diamines data"
    tags: ["spatiotemporal_conditioner", "2AA", "capped_diamines", "transformer", "generalization"]


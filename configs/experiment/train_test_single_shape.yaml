# @package _global_

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.01
  arch:
    n_layers: 2
  max_radius: 1000.0
  optim:
    lr: 0.002


callbacks:
  viz:
    sigma_list: ["${model.sigma_distribution.sigma}"]

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 100
        

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 100

      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 100


trainer:
  val_check_interval: 0.5
  max_epochs: 100

logger:
  wandb:
    group: train_test
    notes: "alanine dipeptide"
    tags: ["single_shape", "ALA_ALA", "standard JAMUN"]
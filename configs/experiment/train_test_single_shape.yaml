# @package _global_

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 4
  max_radius: 1000.0
  optim:
    lr: 0.002


callbacks:
  viz:
    sigma_list: ["${model.sigma_distribution.sigma}"]

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: False
        subsample: 80
        start_frame: 0 
        num_frames: 800000

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: False
        subsample: 80
        start_frame: 800000 
        num_frames: 100000

      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: False
        subsample: 80
        start_frame: 900000 
        num_frames: 200000


trainer:
  val_check_interval: 0.5
  max_epochs: 100

logger:
  wandb:
    group: model_comparison_delta_t_T_models_graphs
    notes: "Standard JAMUN on 2AA capped diamines data"
    tags: ["standard_jamun", "2AA", "capped_diamines", "denoiser", "generalization"]
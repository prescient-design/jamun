# @package _global_

defaults:
  - override /model: denoiser_conditional
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/fake_enhanced_data/ALA_ALA_organized/train"
        traj_pattern: "^(.*).xtc"
        pdb_file: "/data/bucket/kleinhej/capped_diamines/timewarp_splits/train/ALA_ALA.pdb"
        as_iterable: false
        subsample: 1
        total_lag_time: 5
        lag_subsample_rate: 1
        max_datasets: 5000

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/fake_enhanced_data/ALA_ALA_organized/val"
        traj_pattern: "^(.*).xtc"
        pdb_file: "/data/bucket/kleinhej/capped_diamines/timewarp_splits/train/ALA_ALA.pdb"
        as_iterable: false
        subsample: 1
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: 1
        max_datasets: 5000

      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/fake_enhanced_data/ALA_ALA_organized/test"
        traj_pattern: "^(.*).xtc"
        pdb_file: "/data/bucket/kleinhej/capped_diamines/timewarp_splits/train/ALA_ALA.pdb"
        as_iterable: false
        subsample: 1
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: 1
        max_datasets: 5000

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 2
    N_structures: ${data.datamodule.datasets.train.total_lag_time}
  max_radius: 1000.0
  optim:
    lr: 0.002
  conditioner:
    _target_: jamun.model.conditioners.SelfConditioner
    N_structures: ${model.arch.N_structures}
    pretrained_model_path: null
    c_in: null

trainer:
  val_check_interval: 0.5
  max_epochs: 100

logger:
  wandb:
    group: ALA_ALA, enhanced sampling, conditional denoiser
    notes: "Training conditional denoiser on ALA_ALA enhanced sampling data"
    tags: ["train", "enhanced_sampling", "conditional_denoiser", "ALA_ALA"] 
# @package _global_
# Training DenoisedConditioner on enhanced sampling data

defaults:
  - override /model: denoiser_conditional
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/ALA_ALA_enhanced_full_grid/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        subsample: 1
        total_lag_time: 5
        lag_subsample_rate: 1
        # max_datasets: 1

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/ALA_ALA_enhanced_full_grid/val"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        subsample: 1
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: ${data.datamodule.datasets.train.lag_subsample_rate}
        #max_datasets: ${data.datamodule.datasets.train.max_datasets}

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 2
    N_structures: ${data.datamodule.datasets.train.total_lag_time}
  max_radius: 1000.0
  optim:
    lr: 0.002
  conditioner:
    _target_: jamun.model.conditioners.DenoisedConditioner
    N_structures: ${model.arch.N_structures}
    pretrained_model_path: "sule-shashank/jamun/370wpt17"
    c_in: null  # Will be computed automatically by training script

trainer:
  val_check_interval: 0.5
  max_epochs: 50
  devices: 1

logger:
  wandb:
    group: enhanced_sampling_conditioner_comparison
    notes: "DenoisedConditioner pretrained from 370wpt17"
    tags: ["denoised_conditioner", "enhanced_sampling", "pretrained"] 
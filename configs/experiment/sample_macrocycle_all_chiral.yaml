# @package _global_

defaults:
  - override /callbacks:
    - sampler/measure_sampling_time.yaml
    - sampler/save_trajectory.yaml
  - _self_

callbacks:
  sampler:
    save_trajectory:
      timeseries_format: sdf  # or both

init_datasets:
  _target_: jamun.data.parse_datasets_from_directory_new
  root: "/data/davidsd5/both_cremps/prepro/"
  traj_pattern: "^(.*).npz"
  topology_pattern: "^(.*).sdf"
  filter_codes_csv: "/data/davidsd5/jamun_run/outputs/sample/dev/runs/jamun_run_csv_example.csv"
  filter_codes_csv_header: "sequence"
  as_sdf: true
  use_chiral: true  # Enable chirality to match training config
  subsample: 1

num_sampling_steps_per_batch: 5000
num_batches: 10
num_init_samples_per_dataset: 1
repeat_init_samples: 1
continue_chain: true

# New Macrocycle model
#wandb_train_run_path: prescient-design/jamun/bca9l8if # This is the run path of the training produced from the run from Ameya 
# This is the Darcy's all chiral run path
wandb_train_run_path: prescient-design/jamun/frxy5j28
#wandb_train_run_path: prescient-design/jamun/c65kevbw
#wandb_train_run_path: prescient-design/jamun/420g0jdk
#wandb_train_run_path: prescient-design/jamun/nemf3tma


checkpoint_type: best_so_far
sigma: 0.04
M: 1.0
delta: 0.04
friction: 1.0
inverse_temperature: 1.0
score_fn_clip: null

sampler:
  _target_: jamun.sampling.Sampler
  devices: 1

logger:
  wandb:
    group: sample_macrocycle

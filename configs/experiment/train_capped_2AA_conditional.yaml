# @package _global_
defaults:
  - override /model: denoiser_conditional
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml


callbacks:
  viz:
    sigma_list: ["${model.sigma_distribution.sigma}"]

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        num_frames: 320000
        total_lag_time: 5
        lag_subsample_rate: 10

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/val/"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        subsample: 100
        max_datasets: 20
        num_frames: 320000
        total_lag_time: 5
        lag_subsample_rate: 10

      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/test/"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        subsample: 100
        max_datasets: 20
        num_frames: 320000
        total_lag_time: 5
        lag_subsample_rate: 10

trainer:
  val_check_interval: 0.1
  max_epochs: 20

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 3
    N_structures: ${data.datamodule.datasets.train.total_lag_time}
  max_radius: 1000.0
  optim:
    lr: 0.002
  conditioner:
    _target_: jamun.model.conditioners.PositionConditioner
    N_structures: ${model.arch.N_structures}
  multimeasurement: false

logger:
  wandb:
    group: train_capped_2AA

# @package _global_
# Training SpatioTemporalConditioner on 2AA capped diamines data

defaults:
  - override /model: denoiser_conditional_spatiotemporal
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml

data:
  datamodule:
    batch_size: 32
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_GLU', 'GLU_ALA', 'ALA_ALA']
        as_iterable: false
        subsample: 5
        total_lag_time: 5
        lag_subsample_rate: 5
        num_frames: 320000

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['GLU_GLU']
        as_iterable: false
        subsample: 5
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: 5
        num_frames: 10000

      test:
        _target_: jamun.data.parse_datasets_from_directory
        root: "${paths.data_path}/capped_diamines/timewarp_splits/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        filter_codes: ['ALA_ALA']
        as_iterable: false
        subsample: 1
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: 1
        num_frames: 1000

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 1
  max_radius: 1.0
  optim:
    lr: 0.002  # Slightly reduced learning rate for stability

trainer:
  val_check_interval: 0.5
  max_epochs: 100
  devices: 1

logger:
  wandb:
    group: 2AA_capped_diamines_conditioner_comparison
    notes: "SpatioTemporalConditioner on 2AA capped diamines data - processes temporal sequences through spatial and temporal modules"
    tags: ["spatiotemporal_conditioner", "2AA", "capped_diamines", "transformer", "generalization"]


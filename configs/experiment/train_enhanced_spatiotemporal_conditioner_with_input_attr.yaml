# @package _global_
# Training SpatioTemporalConditioner with E3ConvConditionalWithInputAttr on enhanced sampling data

defaults:
  - override /model: denoiser_conditional_with_input_attr
  - override /callbacks:
    - timing.yaml
    - lr_monitor.yaml
    - model_checkpoint.yaml

data:
  datamodule:
    batch_size: 16  # Reduced batch size due to increased model complexity
    datasets:
      train:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/ALA_ALA_enhanced_full_grid/train"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        subsample: 1
        total_lag_time: 5
        lag_subsample_rate: 1
        max_datasets: 2  # Increased for more training data

      val:
        _target_: jamun.data.parse_datasets_from_directory
        root: "/data2/sules/ALA_ALA_enhanced_full_grid/val"
        traj_pattern: "^(.*).xtc"
        pdb_pattern: "^(.*).pdb"
        subsample: 1
        total_lag_time: ${data.datamodule.datasets.train.total_lag_time}
        lag_subsample_rate: ${data.datamodule.datasets.train.lag_subsample_rate}
        max_datasets: ${data.datamodule.datasets.train.max_datasets}

model:
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
  arch:
    n_layers: 2
    N_structures: 1  # E3ConvConditionalWithInputAttr + SpatioTemporalConditioner
  max_radius: 1000.0
  optim:
    lr: 0.0008  # Slightly reduced learning rate for stability with input attributes

trainer:
  val_check_interval: 0.5
  max_epochs: 10
  devices: 1

logger:
  wandb:
    group: enhanced_sampling_spatiotemporal_with_input_attr
    notes: "SpatioTemporalConditioner with E3ConvConditionalWithInputAttr on enhanced sampling data"
    tags: ["spatiotemporal_conditioner", "enhanced_sampling", "input_attr", "e3conv_conditional"] 
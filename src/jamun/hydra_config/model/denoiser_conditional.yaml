defaults:
  - arch: e3conv_conditional.yaml
  - optim: adam.yaml
  - lr_scheduler_config: null
  - conditioner: position.yaml  # Default conditioner, can be overridden
  - _self_

max_radius: null
average_squared_distance: null
add_fixed_noise: false
add_fixed_ones: false
align_noisy_input_during_training: true
align_noisy_input_during_evaluation: true
mean_center: true
mirror_augmentation_rate: 0.0
use_torch_compile: true
torch_compile_kwargs:
  fullgraph: true
  dynamic: true
  mode: default

# Conditioner configuration now comes from defaults above
# Use conditioners=spatiotemporal to use the spatio-temporal conditioner

_target_: jamun.model.denoiser_conditional.Denoiser 
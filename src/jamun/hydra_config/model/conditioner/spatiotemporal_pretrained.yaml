_target_: jamun.model.conditioners.conditioners.SpatioTemporalConditioner
N_structures: 2  # Now returns [y.pos, spatial_features]
c_noise: 0.0
freeze_spatiotemporal_model: false # Trainable by default
c_in: 1.0
# Spatiotemporal model configuration
spatiotemporal_model:
  _target_: jamun.model.arch.spatiotemporal.E3SpatioTemporal
  radial_cutoff: 0.05
  temporal_cutoff: 1.0

  # Spatial module (E3Conv)
  spatial_module:
    _target_: jamun.utils.pretrained_wrapper.return_wrapped_denoiser
    wandb_run_path: "sule-shashank/jamun/sxcdx4wf"
    checkpoint_type: "last"
    trainable: false
    c_in: ${model.conditioner.c_in}


  # Temporal module (E3Transformer)
  temporal_module:
    _target_: jamun.model.arch.spatiotemporal.E3Transformer
    irreps_out: "120x0e + 32x1e"  # Final spatial features output
    irreps_hidden: "120x0e + 32x1e"
    irreps_sh: "1x0e + 1x1e"
    irreps_node_attr: "1x1e"  # Match spatial module output
    num_layers: 2
    edge_attr_dim: 24
    num_attention_heads: 1
    reduce: null

  # Pooling modules
  spatial_to_temporal_pooler:
    _target_: jamun.model.pooling.SpatialTemporalToTemporalNodeAttr
    irreps_out: "1x1e"  # Match spatial module output (from temporal module irreps_node_attr)

  temporal_to_spatial_pooler:
    _target_: jamun.model.pooling.TemporalToSpatialNodeAttrMean
    irreps_out: "120x0e + 32x1e"  # Match temporal module output
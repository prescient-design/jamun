_target_: jamun.model.arch.e3conv_conditional.E3ConvConditionalSpatioTemporal
_partial_: true
irreps_out: "1x1e"  # Output 3 components (1x1e) to match position
irreps_hidden: "120x0e + 32x1e"
irreps_sh: "1x0e + 1x1e"
n_layers: 1
edge_attr_dim: 64  # Match spatiotemporal spatial module
atom_type_embedding_dim: 8
atom_code_embedding_dim: 8
residue_code_embedding_dim: 32  # Match spatiotemporal spatial module  
residue_index_embedding_dim: 8
use_residue_information: ${data.use_residue_information}
use_residue_sequence_index: false
num_atom_types: 20
max_sequence_length: 10
num_atom_codes: 10
num_residue_types: 25
test_equivariance: false
reduce: null
hidden_layer_factory:
  _target_: e3tools.nn.ConvBlock
  _partial_: true
  conv:
    _target_: e3tools.nn.SeparableConv # replace with Conv for non-separable case
    _partial_: true
output_head_factory:
  _target_: e3tools.nn.EquivariantMLP
  _partial_: true
  irreps_hidden_list:
    - ${model.arch.irreps_hidden}
N_structures: 1  # For [y.pos, spatial_features] input
input_attr_irreps: "120x0e + 32x1e"  # spatial_features (9 components = 3x1e) 
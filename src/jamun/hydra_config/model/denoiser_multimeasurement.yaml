defaults:
  - arch: e3conv_conditional.yaml
  - optim: adam.yaml
  - lr_scheduler_config: null
  - _self_

max_radius: null
average_squared_distance: null
add_fixed_noise: false
add_fixed_ones: false
align_noisy_input_during_training: true
align_noisy_input_during_evaluation: true
mean_center: true
mirror_augmentation_rate: 0.0
use_torch_compile: true
torch_compile_kwargs:
  fullgraph: true
  dynamic: true
  mode: default

conditioner:
  _target_: jamun.model.conditioners.PositionConditioner
  N_structures: ${model.arch.N_structures}

# Multimeasurement specific parameters
multimeasurement: true
N_measurements: 1
N_measurements_hidden: 1
max_graphs_per_batch: null

_target_: jamun.model.DenoiserMultimeasurement 
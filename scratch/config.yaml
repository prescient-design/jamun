float32_matmul_precision: high
task_name: train
run_group: dev
run_key: ${now:%Y-%m-%d}_${now:%H-%M-%S}
python:
  version: ${python_version:micro}
init_time: ${now:%y-%m-%d_%H:%M:%S}
compute_average_squared_distance_from_data: true
data:
  datamodule:
    _target_: jamun.data.MDtrajDataModule
    batch_size: 32
    num_workers: 4
    datasets:
      train:
      - _target_: jamun.data.MDtrajDataset
        root: ${paths.data_path}/timewarp/2AA-1-large/train/
        traj_files:
        - AA-traj-arrays.npz
        pdb_file: AA-traj-state0.pdb
        subsample: 100
        label: AA
      val:
      - _target_: jamun.data.MDtrajDataset
        root: ${paths.data_path}/timewarp/2AA-1-large/train/
        traj_files:
        - AA-traj-arrays.npz
        pdb_file: AA-traj-state0.pdb
        subsample: 100
        label: AA
      test:
      - _target_: jamun.data.MDtrajDataset
        root: ${paths.data_path}/timewarp/2AA-1-large/train/
        traj_files:
        - AA-traj-arrays.npz
        pdb_file: AA-traj-state0.pdb
        subsample: 100
        label: AA
  use_residue_information: true
model:
  arch:
    _target_: scratch.e3conv_test.E3Conv
    _partial_: true
    irreps_out: 1x1e
    irreps_hidden: 120x0e + 32x1e
    irreps_sh: 1x0e + 1x1e
    n_layers: 2
    edge_attr_dim: 64
    atom_type_embedding_dim: 8
    atom_code_embedding_dim: 8
    residue_code_embedding_dim: 32
    residue_index_embedding_dim: 8
    use_residue_information: ${data.use_residue_information}
    use_residue_sequence_index: false
    num_atom_types: 20
    max_sequence_length: 10
    num_atom_codes: 10
    num_residue_types: 25
    hidden_layer_factory:
      _target_: e3tools.nn.ConvBlock
      _partial_: true
      conv:
        _target_: e3tools.nn.Conv
        _partial_: true
    output_head_factory:
      _target_: e3tools.nn.EquivariantMLP
      _partial_: true
      irreps_hidden_list:
      - ${model.arch.irreps_hidden}
  optim:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.002
    weight_decay: 0.0
  max_radius: 1000.0
  average_squared_distance: null
  add_fixed_noise: false
  add_fixed_ones: false
  align_noisy_input_during_training: true
  align_noisy_input_during_evaluation: true
  mean_center: true
  mirror_augmentation_rate: 0.0
  use_torch_compile: true
  torch_compile_kwargs:
    fullgraph: true
    dynamic: true
    mode: default
  _target_: jamun.model.Denoiser
  sigma_distribution:
    _target_: jamun.distributions.ConstantSigma
    sigma: 0.04
trainer:
  _target_: lightning.Trainer
  limit_train_batches: 1.0
  val_check_interval: 0.5
  max_epochs: 200
logger:
  wandb:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: jamun
    entity: null
    offline: false
    log_model: all
    group: train_test
    notes: alanine dipeptide, without conditioning.
    save_dir: 
callbacks:
  timing:
    _target_: jamun.callbacks.Timing
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:runtime.output_dir}/checkpoints
    save_top_k: 5
    save_last: true
    monitor: val/loss
  viz:
    _target_: jamun.callbacks.VisualizeDenoise
    datasets: ${data.datamodule.datasets.val}
    sigma_list:
    - ${model.sigma_distribution.sigma}
paths:
  root_path: ${oc.env:JAMUN_ROOT_PATH, "."}
  data_path: ${oc.env:JAMUN_DATA_PATH, ${paths.root_path}/data}
  run_path: ${paths.root_path}/outputs/${task_name}/${run_group}/runs/${run_key}
